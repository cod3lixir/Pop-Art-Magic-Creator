
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Remix Pop-Art Magic Creator</title>
    <meta name="description" content="Transform your photos into trending comic-style Pop Art masterpieces using Gemini's advanced image-to-image generation." />
    <meta property="og:title" content="Remix Pop-Art Magic Creator" />
    <meta property="og:description" content="Transform your photos into trending comic-style Pop Art masterpieces using Gemini's advanced image-to-image generation." />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Luckiest+Guy&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
      .font-comic { font-family: 'Bangers', cursive; }
      .font-cartoon { font-family: 'Luckiest Guy', cursive; }
      body { 
        font-family: 'Inter', sans-serif; 
        background-color: #ffde03;
        background-image: 
          radial-gradient(#ff00ff 1.5px, transparent 1.5px),
          radial-gradient(#00ffff 1px, transparent 1px);
        background-size: 30px 30px, 20px 20px;
        background-position: 0 0, 15px 15px;
        background-attachment: fixed;
      }
      .pop-art-shadow { box-shadow: 12px 12px 0px 0px rgba(0,0,0,1); }
      .pop-art-shadow-sm { box-shadow: 6px 6px 0px 0px rgba(0,0,0,1); }
      .pop-art-border { border: 6px solid black; }
      .pop-art-border-sm { border: 3px solid black; }
      
      .custom-scrollbar::-webkit-scrollbar { width: 8px; }
      .custom-scrollbar::-webkit-scrollbar-track { background: white; border-left: 2px solid black; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background: #ff00ff; border: 2px solid black; }

      @keyframes popIn {
        0% { transform: scale(0.9) rotate(-2deg); opacity: 0; }
        100% { transform: scale(1) rotate(0deg); opacity: 1; }
      }
      .animate-pop { animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
      
      .halftone-overlay {
        background-image: radial-gradient(rgba(0,0,0,0.1) 1px, transparent 0);
        background-size: 4px 4px;
      }

      .cartoon-button {
        transition: all 0.2s ease;
      }
      .cartoon-button:hover {
        transform: translate(-4px, -4px);
        box-shadow: 8px 8px 0px 0px rgba(0,0,0,1);
      }
      .cartoon-button:active {
        transform: translate(2px, 2px);
        box-shadow: 2px 2px 0px 0px rgba(0,0,0,1);
      }
    </style>
  <script type="importmap">

  }
}
</script>
</head>
  <body>
    <div id="root" class="halftone-overlay min-h-screen"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
